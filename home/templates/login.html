{% extends 'base.html' %}

{% block content %}
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
        background: linear-gradient(135deg, #653333, #c87683);
        min-height:100vh;
    }

    .login-wrapper{
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        padding:20px;
    }

    .login-container{
        width:100%;
        max-width:420px;
        background:#fff;
        padding:40px 35px;
        border-radius:18px;
        box-shadow:0 10px 30px rgba(0,0,0,0.2);
        animation:fadeIn 0.5s ease;
    }

    @keyframes fadeIn{
        from{
            opacity:0;
            transform:translateY(20px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    .login-container h2{
        text-align:center;
        color:#333;
        margin-bottom:10px;
        font-size:32px;
    }

    .subtitle{
        text-align:center;
        color:#777;
        margin-bottom:30px;
        font-size:15px;
    }

    form p{
        margin-bottom:18px;
    }

    form label{
        display:block;
        margin-bottom:6px;
        color:#444;
        font-weight:600;
    }

    form input{
        width:100%;
        padding:14px;
        border:1px solid #ccc;
        border-radius:10px;
        font-size:15px;
        transition:0.3s;
    }

    form input:focus{
        border-color:#667eea;
        outline:none;
        box-shadow:0 0 0 4px rgba(102,126,234,0.15);
    }

    .form-options{
        display:flex;
        justify-content:flex-end;
        margin-bottom:20px;
    }

    .form-options a{
        text-decoration:none;
        color:#667eea;
        font-size:14px;
    }

    .form-options a:hover{
        text-decoration:underline;
    }

    button{
        width:100%;
        padding:14px;
        border:none;
        border-radius:10px;
        background:linear-gradient(135deg,#667eea,#764ba2);
        color:#fff;
        font-size:16px;
        font-weight:600;
        cursor:pointer;
        transition:0.3s;
    }

    button:hover{
        transform:translateY(-2px);
        box-shadow:0 8px 20px rgba(102,126,234,0.3);
    }

    .footer-text{
        text-align:center;
        margin-top:25px;
        color:#666;
        font-size:14px;
    }

    .footer-text a{
        color:#667eea;
        text-decoration:none;
        font-weight:600;
    }

    .footer-text a:hover{
        text-decoration:underline;
    }

    @media(max-width:480px){
        .login-container{
            padding:30px 25px;
        }
    }
</style>

<div class="login-wrapper">
    <div class="login-container">
        <h2>Welcome Back</h2>
        <p class="subtitle">Please enter your details to login</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="form-options">
                <a href="#">Forgot password?</a>
            </div>

            <button type="submit">Login</button>
        </form>

        <p class="footer-text">
            New here?
            <a href="{% url 'signup' %}">Sign up for free</a>
        </p>
    </div>
</div>
{% endblock %}
