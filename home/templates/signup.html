{% extends 'base.html' %}

{% block content %}
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body{
        background:linear-gradient(135deg, #653333, #c87683);
        min-height:100vh;
    }

    .register-wrapper{
        display:flex;
        justify-content:center;
        align-items:center;
        min-height:100vh;
        padding:20px;
    }

    .register-card{
        width:100%;
        max-width:450px;
        background:#fff;
        padding:40px 35px;
        border-radius:20px;
        box-shadow:0 12px 35px rgba(0,0,0,0.2);
        animation:slideUp 0.5s ease;
    }

    @keyframes slideUp{
        from{
            opacity:0;
            transform:translateY(30px);
        }
        to{
            opacity:1;
            transform:translateY(0);
        }
    }

    .register-card h2{
        text-align:center;
        margin-bottom:10px;
        color:#222;
        font-size:32px;
    }

    .subtitle{
        text-align:center;
        color:#666;
        margin-bottom:30px;
        font-size:15px;
    }

    form p{
        margin-bottom:18px;
    }

    form label{
        display:block;
        margin-bottom:6px;
        color:#444;
        font-weight:600;
    }

    form input{
        width:100%;
        padding:14px;
        border:1px solid #ccc;
        border-radius:10px;
        font-size:15px;
        transition:0.3s;
    }

    form input:focus{
        outline:none;
        border-color:#4facfe;
        box-shadow:0 0 0 4px rgba(79,172,254,0.2);
    }

    button{
        width:100%;
        padding:14px;
        border:none;
        border-radius:10px;
        background:linear-gradient(135deg,#4facfe,#00c6fb);
        color:#fff;
        font-size:16px;
        font-weight:600;
        cursor:pointer;
        transition:0.3s;
        margin-top:10px;
    }

    button:hover{
        transform:translateY(-2px);
        box-shadow:0 8px 20px rgba(79,172,254,0.35);
    }

    .login-link{
        text-align:center;
        margin-top:25px;
        color:#666;
        font-size:14px;
    }

    .login-link a{
        color:#0077ff;
        text-decoration:none;
        font-weight:600;
        margin-left:5px;
    }

    .login-link a:hover{
        text-decoration:underline;
    }

    @media(max-width:480px){
        .register-card{
            padding:30px 25px;
        }

        .register-card h2{
            font-size:26px;
        }
    }
</style>

<div class="register-wrapper">
    <div class="register-card">
        <h2>Create an Account</h2>
        <p class="subtitle">Join us by filling in the details below</p>

        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Register</button>
        </form>

        <p class="login-link">
            Already have an account?
            <a href="{% url 'login' %}">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
