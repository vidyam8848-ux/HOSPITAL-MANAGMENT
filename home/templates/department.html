{% extends 'base.html' %}

{% block content %}

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f7fb;
    }

    h1 {
        text-align: center;
        margin-top: 20px;
        color: #333;
    }

    .dept-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 25px;
        padding: 40px;
    }

    .dept-card {
        width: 300px;
        background: #ffffff;
        border-radius: 15px;
        padding: 20px;
        box-shadow: 0 5px 18px rgba(0,0,0,0.1);
        transition: 0.3s;
        border-left: 6px solid #007bff;
    }

    .dept-card:hover {
        transform: translateY(-5px);
    }

    .dept-name {
        font-size: 20px;
        font-weight: bold;
        color: #007bff;
        margin-bottom: 10px;
    }

    .dept-desc {
        color: #555;
        font-size: 14px;
        line-height: 1.5;
    }

</style>

<h1>Our Departments</h1>

<div class="dept-container">

    {% for d in dept1 %}
    <div class="dept-card">

        <div class="dept-name">
            {{ d.dept_name }}
        </div>

        <div class="dept-desc">
            {{ d.dept_desc }}
        </div>

    </div>
    {% endfor %}

</div>

{% endblock %}
